name: ecoroute_driver_app
description: Aplicación móvil para conductores de TransLogística Express (EcoRoute).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Networking & Functional Programming
  dio: ^5.4.0
  dartz: ^0.10.1

  # Local Storage & DB (Offline First)
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2

  # Navigation
  go_router: ^13.1.0

  # UI / GPS / Camera
  geolocator: ^10.1.0
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
