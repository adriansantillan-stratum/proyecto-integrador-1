<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1155" viewBox="0 0 1800 1155"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#315675" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="35" y="48" font-family="Arial" font-size="30" font-weight="700" fill="#1c3448" text-anchor="start">Resolución de incidencias conservando el resultado histórico</text>
<text x="130.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">Conductor</text>
<line x1="130.0" y1="150" x2="130.0" y2="1130" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="515.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">Dispatcher</text>
<line x1="515.0" y1="150" x2="515.0" y2="1130" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="900.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">Servicio P04</text>
<line x1="900.0" y1="150" x2="900.0" y2="1130" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="1285.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">PostgreSQL</text>
<line x1="1285.0" y1="150" x2="1285.0" y2="1130" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="1670.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">Jefatura</text>
<line x1="1670.0" y1="150" x2="1670.0" y2="1130" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<polyline points="130.0,210 900.0,210" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="142.0" y="192" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">1. Registra FAILED o RETURNED con motivo obligatorio</text>
<polyline points="900.0,315 1285.0,315" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="297" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">2. Historial y una incidencia abierta por pedido</text>
<polyline points="515.0,420 900.0,420" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="527.0" y="402" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">3. Evalúa el caso y acuerda recuperación con el cliente</text>
<polyline points="900.0,525 1285.0,525" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="507" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">4. RETRY requiere jornada activa y crea un nuevo intento IN_TRANSIT</text>
<polyline points="900.0,630 1285.0,630" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="612" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">5. REPLAN requiere otra ruta PLANNED y crea un intento ASSIGNED</text>
<polyline points="900.0,735 1285.0,735" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="717" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">6. En reprogramación deja pendiente la nueva aceptación comercial</text>
<polyline points="515.0,840 900.0,840" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="527.0" y="822" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">7. Nueva ventana vigente y confirmación de condiciones antes de aprobar</text>
<polyline points="1670.0,945 900.0,945" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="927" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">8. CLOSE_FAILED o CLOSE_CASE exige autorización de jefatura</text>
<polyline points="900.0,1050 1285.0,1050" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="1032" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">9. Vínculo order_attempts y auditoría; el pedido original no se reabre</text></svg>