<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1365" viewBox="0 0 1800 1365"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#315675" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="35" y="48" font-family="Arial" font-size="30" font-weight="700" fill="#1c3448" text-anchor="start">Entrega con evidencia y sincronización idempotente</text>
<text x="130.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">Conductor Flutter</text>
<line x1="130.0" y1="150" x2="130.0" y2="1340" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="515.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">Outbox local</text>
<line x1="515.0" y1="150" x2="515.0" y2="1340" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="900.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">Backend</text>
<line x1="900.0" y1="150" x2="900.0" y2="1340" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="1285.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">PostgreSQL</text>
<line x1="1285.0" y1="150" x2="1285.0" y2="1340" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="1670.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">S3 y SQS</text>
<line x1="1670.0" y1="150" x2="1670.0" y2="1340" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<polyline points="130.0,210 195.0,210 195.0,240 130.0,240" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="210.0" y="192" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">1. Captura foto, firma, receptor, DNI, GPS y hora del dispositivo</text>
<polyline points="130.0,315 515.0,315" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="142.0" y="297" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">2. Persiste operación por cuenta y pedido antes de informar pendiente</text>
<polyline points="515.0,420 900.0,420" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="527.0" y="402" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">3. POST delivery-proofs al disponer de conexión y sesión válida</text>
<polyline points="900.0,525 1285.0,525" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="507" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">4. Bloquea pedido, valida propiedad y estado IN_TRANSIT</text>
<polyline points="900.0,630 1670.0,630" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="612" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">5. Sube archivos privados con claves únicas</text>
<polyline points="900.0,735 1285.0,735" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="717" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">6. En Docker guarda respaldo durable de bytes para el emulador</text>
<polyline points="900.0,840 1285.0,840" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="822" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">7. Guarda POD, hashes SHA256, hora de recepción y captura</text>
<polyline points="900.0,945 1285.0,945" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="927" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">8. Cambia a DELIVERED, historial y outbox en la misma transacción</text>
<polyline points="900.0,1050 515.0,1050" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="527.0" y="1032" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">9. Responde POD confirmado; el reenvío devuelve el mismo POD</text>
<polyline points="900.0,1155 1670.0,1155" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="1137" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">10. Worker publica con reintento y consume evento</text>
<polyline points="900.0,1260 1285.0,1260" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="912.0" y="1217" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">11. Notificación única; el emisor comprueba confirmación antes de dar</text>
<text x="912.0" y="1242" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">por finalizado el evento</text></svg>