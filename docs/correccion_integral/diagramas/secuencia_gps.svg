<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#315675" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="35" y="48" font-family="Arial" font-size="30" font-weight="700" fill="#1c3448" text-anchor="start">Seguimiento GPS autenticado y distribuido</text>
<text x="130.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">Flutter GPS</text>
<line x1="130.0" y1="150" x2="130.0" y2="1025" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="515.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">REST GPS</text>
<line x1="515.0" y1="150" x2="515.0" y2="1025" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="900.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">PostgreSQL</text>
<line x1="900.0" y1="150" x2="900.0" y2="1025" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="1285.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">Redis</text>
<line x1="1285.0" y1="150" x2="1285.0" y2="1025" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<text x="1670.0" y="100" font-family="Arial" font-size="20" font-weight="700" fill="#1c3448" text-anchor="middle">WebSocket web</text>
<line x1="1670.0" y1="150" x2="1670.0" y2="1025" stroke="#b1bdc8" stroke-dasharray="6 5"/>
<polyline points="130.0,210 515.0,210" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="142.0" y="192" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">1. Ping usa driverId y vehicleId reales de la ruta en ejecución</text>
<polyline points="515.0,315 580.0,315 580.0,345 515.0,345" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="595.0" y="297" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">2. JWT, conductor propietario, vehículo y ruta activa</text>
<polyline points="515.0,420 900.0,420" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="527.0" y="402" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">3. Persiste coordenadas, velocidad y fecha de la muestra</text>
<polyline points="515.0,525 1285.0,525" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="527.0" y="507" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">4. Publica ecoroute:gps con el identificador del vehículo</text>
<polyline points="1670.0,630 515.0,630" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="527.0" y="612" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">5. Primer mensaje WebSocket con accessToken y vehicleId</text>
<polyline points="515.0,735 580.0,735 580.0,765 515.0,765" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="595.0" y="717" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">6. Valida JWT y autorización; anónimo se cierra con código 1008</text>
<polyline points="1285.0,840 1670.0,840" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1233.0" y="822" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">7. PubSub entrega puntos solo a suscripciones autorizadas</text>
<polyline points="1670.0,945 1735.0,945 1735.0,975 1670.0,975" fill="none" stroke="#315675" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1150.0" y="902" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">8. Mapa actualiza marcador y mantiene alternativa de polling al fallar</text>
<text x="1150.0" y="927" font-family="Arial" font-size="20" font-weight="400" fill="#1c3448" text-anchor="start">el canal</text></svg>