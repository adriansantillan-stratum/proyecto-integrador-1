<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1160" viewBox="0 0 1700 1160"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#48667e" stroke-width="1.5"/></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="white" stroke="#48667e" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="30" fill="#153d5b" text-anchor="start"><tspan x="38" dy="0">Arquitectura local observada · 26/10/2026</tspan></text><text x="38" y="82" font-family="Arial, sans-serif" font-size="18" fill="#52677b" text-anchor="start"><tspan x="38" dy="0">Procesos de aplicación nativos; dependencias aisladas en Docker. PostgreSQL de negocio e identidad permanecen separados.</tspan></text><rect x="30" y="110" width="1640" height="630" rx="12" fill="#f6fafc" stroke="#b6c7d4"/><text x="50" y="141" font-family="Arial, sans-serif" font-size="21" fill="#18324b" text-anchor="start"><tspan x="50" dy="0">HOST LOCAL / tres espacios de trabajo de VS Code</tspan></text><rect x="70" y="170" width="450" height="150" rx="10" fill="#f3f8fb" stroke="#6f8ba1" stroke-width="1.5"/><text x="86" y="202" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="86" dy="0">React 19 · Vite 3000</tspan></text><text x="86" y="234" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="86" dy="0">Navegador · TypeScript · hooks</tspan><tspan x="86" dy="25.6">/api y /ws → proxy hacia Java</tspan><tspan x="86" dy="25.6">Authorization Code + PKCE</tspan></text><rect x="610" y="170" width="480" height="150" rx="10" fill="#f3f8fb" stroke="#6f8ba1" stroke-width="1.5"/><text x="626" y="202" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="626" dy="0">Spring Boot · Java 17 · 8081</tspan></text><text x="626" y="234" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="626" dy="0">WebFlux + R2DBC · perfiles local,ide</tspan><tspan x="626" dy="25.6">JVM depurable en 127.0.0.1:5005</tspan><tspan x="626" dy="25.6">Monolito modular con puertos/adaptadores</tspan></text><rect x="1180" y="170" width="450" height="150" rx="10" fill="#f3f8fb" stroke="#6f8ba1" stroke-width="1.5"/><text x="1196" y="202" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="1196" dy="0">Flutter debug · Android</tspan></text><text x="1196" y="234" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="1196" dy="0">BLoC · GetIt · Dio</tspan><tspan x="1196" dy="25.6">10.0.2.2 → servicios del host</tspan><tspan x="1196" dy="25.6">Copia de fuentes verificada por hash</tspan></text><path d="M520,245 L610,245" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="572" y="237" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="572" dy="0">HTTP</tspan></text><path d="M1180,245 L1090,245" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1142" y="237" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="1142" dy="0">HTTP</tspan></text><path d="M850,370 L1110,485 L1110,590 L850,705 L590,590 L590,485 Z" fill="#e8f3f6" stroke="#2b7285" stroke-width="2"/><text x="850" y="451" font-family="Arial, sans-serif" font-size="27" fill="#174d64" text-anchor="middle"><tspan x="850" dy="0">Backend EcoRoute</tspan></text><text x="850" y="493" font-family="Arial, sans-serif" font-size="23" fill="#18324b" text-anchor="middle"><tspan x="850" dy="0">Entrada REST / WebSocket</tspan><tspan x="850" dy="29.44">Casos de uso y servicios</tspan><tspan x="850" dy="29.44">Dominio y puertos</tspan><tspan x="850" dy="29.44">Adaptadores R2DBC / OSRM / AWS</tspan></text><path d="M850,320 L850,370" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="75" y="415" width="430" height="175" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="91" y="447" font-family="Arial, sans-serif" font-size="23" fill="#134766" text-anchor="start"><tspan x="91" dy="0">Seguridad de aplicación</tspan></text><text x="91" y="479" font-family="Arial, sans-serif" font-size="21" fill="#18324b" text-anchor="start"><tspan x="91" dy="0">JWT: firma, emisor y vencimiento</tspan><tspan x="91" dy="26.88">Roles ADMIN / DISPATCHER / DRIVER</tspan><tspan x="91" dy="26.88">OperationalAccess: subject ↔ conductor</tspan><tspan x="91" dy="26.88">Redis: revocación y Pub/Sub</tspan></text><path d="M505,500 L590,500" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="554.5" y="492" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="554.5" dy="0">contexto</tspan></text><rect x="1190" y="415" width="430" height="175" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="1206" y="447" font-family="Arial, sans-serif" font-size="23" fill="#134766" text-anchor="start"><tspan x="1206" dy="0">Límites de la ejecución</tspan></text><text x="1206" y="479" font-family="Arial, sans-serif" font-size="21" fill="#18324b" text-anchor="start"><tspan x="1206" dy="0">Sin tráfico vial en tiempo real</tspan><tspan x="1206" dy="26.88">Sin despliegue productivo certificado</tspan><tspan x="1206" dy="26.88">S3/SQS emulados por LocalStack</tspan><tspan x="1206" dy="26.88">CLI inicia; IDE adjunta depuradores</tspan></text><rect x="30" y="770" width="1640" height="325" rx="12" fill="#fffaf1" stroke="#bcab88"/><text x="50" y="803" font-family="Arial, sans-serif" font-size="21" fill="#18324b" text-anchor="start"><tspan x="50" dy="0">DOCKER · servicios externos al proceso Java</tspan></text><rect x="60" y="838" width="285" height="154" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="76" y="870" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="76" dy="0">PostgreSQL 14</tspan></text><text x="76" y="902" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="76" dy="0">5433 host → 5432</tspan><tspan x="76" dy="25.6">Base ecoroute + Flyway</tspan></text><path d="M850,708 L202,838" fill="none" stroke="#48667e" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="390" y="838" width="285" height="154" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="406" y="870" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="406" dy="0">Redis 7</tspan></text><text x="406" y="902" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="406" dy="0">16379 → 6379 (IDE)</tspan><tspan x="406" dy="25.6">Revocación / posiciones</tspan></text><path d="M850,708 L532,838" fill="none" stroke="#48667e" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="720" y="838" width="285" height="154" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="736" y="870" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="736" dy="0">Keycloak 23</tspan></text><text x="736" y="902" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="736" dy="0">HTTP 8080</tspan><tspan x="736" dy="25.6">H2 propia en volumen</tspan></text><path d="M850,708 L862,838" fill="none" stroke="#48667e" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="1050" y="838" width="285" height="154" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="1066" y="870" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="1066" dy="0">LocalStack 3.8</tspan></text><text x="1066" y="902" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="1066" dy="0">HTTP 4566</tspan><tspan x="1066" dy="25.6">Bucket S3 + cola SQS</tspan></text><path d="M850,708 L1192,838" fill="none" stroke="#48667e" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="1380" y="838" width="285" height="154" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="1396" y="870" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="1396" dy="0">OSRM Perú</tspan></text><text x="1396" y="902" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="1396" dy="0">HTTP 5000</tspan><tspan x="1396" dy="25.6">Red vial MLD / sin</tspan><tspan x="1396" dy="25.6">tráfico</tspan></text><path d="M850,708 L1522,838" fill="none" stroke="#48667e" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="60" y="1043" font-family="Arial, sans-serif" font-size="19" fill="#52677b" text-anchor="start"><tspan x="60" dy="0">Keycloak conserva cuentas, roles y sesiones en H2 independiente; no hay FK física a PostgreSQL.</tspan><tspan x="60" dy="24.32">El cliente web también depende de geocodificación/teselas externas. El modo Docker de aplicaciones existe, pero no describe este ensayo.</tspan></text></svg>