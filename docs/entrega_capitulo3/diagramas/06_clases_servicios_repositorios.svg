one" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="544.5" y="532" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="544.5" dy="0">utiliza</tspan></text><rect x="45" y="835" width="460" height="174" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="61" y="867" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="61" dy="0">«adapter» R2dbcOrderRepository</tspan></text><text x="61" y="899" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="61" dy="0">springDataOrderRepository</tspan><tspan x="61" dy="25.6">SpringDataOrderRepository inyectado</tspan><tspan x="61" dy="25.6">──────────────</tspan><tspan x="61" dy="25.6">save(...) / lockById(...)</tspan></text><path d="M275,835 L275,646" fill="none" stroke="#48667e" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#triangle)"/><text x="282" y="732.5" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="282" dy="0">realiza</tspan></text><rect x="650" y="835" width="500" height="174" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="666" y="867" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="666" dy="0">«interface» SpringDataOrderRepository</tspan></text><text x="666" y="899" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="666" dy="0">extends ReactiveCrudRepository</tspan><tspan x="666" dy="25.6">&lt;OrderEntity, Long&gt;</tspan><tspan x="666" dy="25.6">──────────────</tspan><tspan x="666" dy="25.6">Consultas de orders</tspan></text><path d="M505,930 L650,930" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="584.5" y="922" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="584.5" dy="0">delega</tspan></text><rect x="1220" y="835" width="375" height="122" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="1236" y="867" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="1236" dy="0">«entity» OrderEntity</tspan></text><text x="1236" y="899" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="1236" dy="0">@Table(&quot;orders&quot;)</tspan><tspan x="1236" dy="25.6">Campos para persistencia R2DBC</tspan></text><path d="M1150,930 L1220,930" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1192" y="922" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="1192" dy="0">opera</tspan></text><text x="45" y="1125" font-family="Arial, sans-serif" font-size="21" fill="#52677b" text-anchor="start"><tspan x="45" dy="0">No hay una clase KpiReportService en la implementación actual: el cálculo de indicadores está en DashboardService y AnalyticsModels.Kpi.</tspan><tspan x="45" dy="26.88">La transacción reactiva cubre escrituras R2DBC; las subidas S3 y cambios de Keycloak no son una transacción distribuida PostgreSQL.</tspan></text></svg>