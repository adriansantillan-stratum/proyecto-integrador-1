<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1210" viewBox="0 0 1640 1210"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#48667e" stroke-width="1.5"/></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="white" stroke="#48667e" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="30" fill="#153d5b" text-anchor="start"><tspan x="38" dy="0">Clases reales · caso de uso y repositorios</tspan></text><text x="38" y="82" font-family="Arial, sans-serif" font-size="18" fill="#52677b" text-anchor="start"><tspan x="38" dy="0">Ejemplo completo de dependencia e inversión: el caso de uso conoce el contrato OrderRepository; el adaptador lo implementa.</tspan></text><rect x="45" y="140" width="460" height="148" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="61" y="172" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="61" dy="0">«REST» OrderController</tspan></text><text x="61" y="204" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="61" dy="0">createOrderUseCase: CreateOrderUseCase</tspan><tspan x="61" dy="25.6">──────────────</tspan><tspan x="61" dy="25.6">createOrder(request): Mono&lt;Order&gt;</tspan></text><rect x="1070" y="140" width="520" height="122" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="1086" y="172" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="1086" dy="0">«interface» CreateOrderUseCase</tspan></text><text x="1086" y="204" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="1086" dy="0">──────────────</tspan><tspan x="1086" dy="25.6">createOrder(order): Mono&lt;Order&gt;</tspan></text