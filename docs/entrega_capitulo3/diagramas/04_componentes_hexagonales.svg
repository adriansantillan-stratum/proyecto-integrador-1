<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1170" viewBox="0 0 1660 1170"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#48667e" stroke-width="1.5"/></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="white" stroke="#48667e" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="30" fill="#153d5b" text-anchor="start"><tspan x="38" dy="0">Componentes implementados y dependencias</tspan></text><text x="38" y="82" font-family="Arial, sans-serif" font-size="18" fill="#52677b" text-anchor="start"><tspan x="38" dy="0">Flecha: utiliza. Borde interior: núcleo funcional. La arquitectura es hexagonal con acoplamientos concretos identificados.</tspan></text><rect x="40" y="135" width="450" height="160" rx="10" fill="#f3f8fb" stroke="#6f8ba1" stroke-width="1.5"/><text x="56" y="167" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="56" dy="0">«component» React web-admin</tspan></text><text x="56" y="199" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="56" dy="0">Páginas → services/api</tspan><tspan x="56" dy="25.6">AuthProvider / useQuery</tspan><tspan x="56" dy="25.6">TrackingMap / ImprovementActions</tspan></text><rect x="1170" y="135" width="450" height="160" rx="10" fill="#f3f8fb" stroke="#6f8ba1" stroke-width="1.5"/><text x="1186" y="167" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="1186" dy="0">«component» Flutter</tspan></text><text x="1186" y="199" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="1186" dy="0">Pages → BLoC → usecases/repos</tspan><tspan x="1186" dy="25.6">Dio / AuthInterceptor / ProofSync</tspan><tspan x="1186" dy="25.6">RoutesPage acepta vía DataSource</tspan></text><rect x="535" y="120" width="590" height="890" rx="14" fill="#f1f8fb" stroke="#577d96" stroke-width="2"/><text x="555" y="151" font-family="Arial, sans-serif" font-size="22" fill="#18324b" text-anchor="start"><tspan x="555" dy="0">Proceso Java / backend</tspan></text><rect x="565" y="185" width="530" height="175" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="581" y="217" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="581" dy="0">«entrada» infrastructure/input</tspan></text><text x="581" y="249" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="581" dy="0">OrderController / RouteController</tspan><tspan x="581" dy="25.6">BusinessWorkflowController</tspan><tspan x="581" dy="25.6">BusinessOperationsController</tspan><tspan x="581" dy="25.6">DeliveryProofController / GpsWebSocketHandler</tspan></text><rect x="565" y="423" width="530" height="205" rx="10" fill="#e8f2f5" stroke="#6f8ba1" stroke-width="1.5"/><text x="581" y="455" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="581" dy="0">«aplicación» application</tspan></text><text x="581" y="487" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="581" dy="0">OrderUseCasesImpl / RouteUseCasesImpl</tspan><tspan x="581" dy="25.6">BusinessWorkflowService</tspan><tspan x="581" dy="25.6">BusinessOperationsService / DashboardService</tspan><tspan x="581" dy="25.6">CreateDeliveryProofUseCaseImpl</tspan><tspan x="581" dy="25.6">RoutePlannerService / S3Service</tspan></text><rect x="565" y="700" width="530" height="215" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="581" y="732" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="581" dy="0">«dominio» domain</tspan></text><text x="581" y="764" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="581" dy="0">Order / Route / DeliveryProof / OrderLifecycle</tspan><tspan x="581" dy="25.6">BusinessWorkflow / BusinessOperations</tspan><tspan x="581" dy="25.6">Ports in: CreateOrderUseCase, etc.</tspan><tspan x="581" dy="25.6">Ports out: OrderRepository, BusinessWorkflowPort,</tspan><tspan x="581" dy="25.6">BusinessOperationsPort, AnalyticsQueryPort,</tspan><tspan x="581" dy="25.6">RoutingPort, ProofIntegrityPort, etc.</tspan></text><path d="M830,360 L830,423" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="837" y="383.5" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="837" dy="0">invoca</tspan></text><path d="M830,628 L830,700" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="837" y="656" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="837" dy="0">depende</tspan></text><path d="M490,215 L565,260" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="534.5" y="229.5" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="534.5" dy="0">HTTP</tspan></text><path d="M1170,215 L1095,260" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1139.5" y="229.5" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="1139.5" dy="0">HTTP</tspan></text><rect x="40" y="445" width="450" height="205" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="56" y="477" font-family="Arial, sans-serif" font-size="21" fill="#134766" text-anchor="start"><tspan x="56" dy="0">«salida» persistencia R2DBC</tspan></text><text x="56" y="509" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="start"><tspan x="56" dy="0">R2dbcOrderRepository / R2dbcRouteRepository</tspan><tspan x="56" dy="24.32">R2dbcDeliveryProofRepository</tspan><tspan x="56" dy="24.32">R2dbcBusinessWorkflowAdapter</tspan><tspan x="56" dy="24.32">R2dbcBusinessOperationsAdapter</tspan><tspan x="56" dy="24.32">R2dbcAnalyticsAdapter</tspan></text><path d="M565,535 L490,535" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="534.5" y="527" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="534.5" dy="0">puertos</tspan></text><rect x="1170" y="445" width="450" height="205" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="1186" y="477" font-family="Arial, sans-serif" font-size="21" fill="#134766" text-anchor="start"><tspan x="1186" dy="0">«salida» integración</tspan></text><text x="1186" y="509" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="start"><tspan x="1186" dy="0">OsrmRoutingAdapter → OSRM</tspan><tspan x="1186" dy="24.32">S3Service → S3AsyncClient</tspan><tspan x="1186" dy="24.32">NotificationService → delivery_outbox</tspan><tspan x="1186" dy="24.32">DeliveryEventWorker → SQS / notifications</tspan><tspan x="1186" dy="24.32">KeycloakAdministration → API + Redis</tspan></text><path d="M1095,535 L1170,535" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1139.5" y="527" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="1139.5" dy="0">utiliza</tspan></text><rect x="40" y="745" width="450" height="190" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="56" y="777" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="56" dy="0">«infraestructura» seguridad</tspan></text><text x="56" y="809" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="56" dy="0">SecurityConfig y JWT decoder</tspan><tspan x="56" dy="25.6">OperationalAccess</tspan><tspan x="56" dy="25.6">Primer frame WebSocket autorizado</tspan><tspan x="56" dy="25.6">RateLimitFilter en memoria</tspan></text><path d="M490,805 L565,805" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="534.5" y="797" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="534.5" dy="0">contexto</tspan></text><rect x="1170" y="745" width="450" height="190" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="1186" y="777" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="1186" dy="0">«infraestructura» datos externos</tspan></text><text x="1186" y="809" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="1186" dy="0">PostgreSQL / Flyway JDBC</tspan><tspan x="1186" dy="25.6">Redis Pub/Sub y revocaciones</tspan><tspan x="1186" dy="25.6">Keycloak / H2 independiente</tspan><tspan x="1186" dy="25.6">LocalStack y OSRM</tspan></text><path d="M1395,650 L1395,745" fill="none" stroke="#48667e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="40" y="1052" font-family="Arial, sans-serif" font-size="21" fill="#52677b" text-anchor="start"><tspan x="40" dy="0">No todos los flujos pasan por un puerto de entrada: Workflow y Operations usan servicios directamente.</tspan><tspan x="40" dy="26.88">CreateDeliveryProofUseCaseImpl depende de S3Service y NotificationService concretos; no se afirma independencia tecnológica absoluta.</tspan><tspan x="40" dy="26.88">Flyway usa JDBC para migración; las consultas operativas emplean R2DBC y no JPA/Hibernate.</tspan></text></svg>