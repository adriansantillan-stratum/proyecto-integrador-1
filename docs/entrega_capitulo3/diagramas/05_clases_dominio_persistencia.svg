<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1260" viewBox="0 0 1640 1260"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#48667e" stroke-width="1.5"/></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="white" stroke="#48667e" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="30" fill="#153d5b" text-anchor="start"><tspan x="38" dy="0">Clases reales · dominio y representación persistente</tspan></text><text x="38" y="82" font-family="Arial, sans-serif" font-size="18" fill="#52677b" text-anchor="start"><tspan x="38" dy="0">Asociaciones por identificadores: no se atribuyen colecciones JPA ni composición de objetos a los records Java.</tspan></text><rect x="50" y="140" width="400" height="148" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="66" y="172" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="66" dy="0">«record» Driver</tspan></text><text x="66" y="204" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="66" dy="0">id: Long</tspan><tspan x="66" dy="25.6">externalId: String</tspan><tspan x="66" dy="25.6">isActive: Boolean</tspan></text><rect x="620" y="140" width="400" height="148" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="636" y="172" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="636" dy="0">«record» Route</tspan></text><text x="636" y="204" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="636" dy="0">id, driverId, vehicleId: Long</tspan><tspan x="636" dy="25.6">routeDate: LocalDate</tspan><tspan x="636" dy="25.6">status: RouteStatus</tspan></text><rect x="1190" y="140" width="400" height="148" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="1206" y="172" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="1206" dy="0">«record» Vehicle</tspan></text><text x="1206" y="204" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="1206" dy="0">id: Long</tspan><tspan x="1206" dy="25.6">plateNumber: String</tspan><tspan x="1206" dy="25.6">capacityKg: Double</tspan></text><path d="M620,235 L450,235" fill="none" stroke="#48667e" stroke-width="1.7" /><text x="535" y="204" font-family="Arial, sans-serif" font-size="18" fill="#294c64" text-anchor="middle"><tspan x="535" dy="0">driverId</tspan><tspan x="535" dy="23.04">1 ← 0..*</tspan></text><path d="M1020,235 L1190,235" fill="none" stroke="#48667e" stroke-width="1.7" /><text x="1105" y="204" font-family="Arial, sans-serif" font-size="18" fill="#294c64" text-anchor="middle"><tspan x="1105" dy="0">vehicleId</tspan><tspan x="1105" dy="23.04">0..* → 1</tspan></text><rect x="50" y="480" width="400" height="226" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="66" y="512" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="66" dy="0">«record» Order</tspan></text><text x="66" y="544" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="66" dy="0">id, routeId: Long</tspan><tspan x="66" dy="25.6">trackingNumber: String</tspan><tspan x="66" dy="25.6">status: OrderStatus</tspan><tspan x="66" dy="25.6">──────────────</tspan><tspan x="66" dy="25.6">withAssignment(...)</tspan><tspan x="66" dy="25.6">withStatus(...)</tspan></text><rect x="620" y="480" width="400" height="200" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="636" y="512" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="636" dy="0">«record» DeliveryProof</tspan></text><text x="636" y="544" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="636" dy="0">id, orderId: Long</tspan><tspan x="636" dy="25.6">imageUrl, signatureDataUrl: String</tspan><tspan x="636" dy="25.6">receiverName, receiverDni: String</tspan><tspan x="636" dy="25.6">verifiedAt: OffsetDateTime</tspan><tspan x="636" dy="25.6">latitude, longitude: Double</tspan></text><rect x="1190" y="480" width="400" height="226" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="1206" y="512" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="1206" dy="0">«record anidado» Confirmation</tspan></text><text x="1206" y="544" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="1206" dy="0">BusinessWorkflow.Confirmation</tspan><tspan x="1206" dy="25.6">orderId: Long</tspan><tspan x="1206" dy="25.6">customerAccepted: boolean</tspan><tspan x="1206" dy="25.6">addressVerified, coverageVerified</tspan><tspan x="1206" dy="25.6">──────────────</tspan><tspan x="1206" dy="25.6">complete(): boolean</tspan></text><path d="M700,340 L700,398 L250,398 L250,480" fill="none" stroke="#48667e" stroke-width="1.7"/><text x="300" y="387" font-family="Arial, sans-serif" font-size="18" fill="#18324b" text-anchor="start"><tspan x="300" dy="0">Route 0..1 ← 0..* Order (routeId)</tspan></text><path d="M450,576 L620,576" fill="none" stroke="#48667e" stroke-width="1.7" /><text x="542" y="568" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="542" dy="0">1 — 0..1</tspan></text><path d="M450,708 L450,795 L1370,795 L1370,733" fill="none" stroke="#48667e" stroke-width="1.7"/><text x="590" y="783" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="start"><tspan x="590" dy="0">Order 1 — 0..1 Confirmation (orderId)</tspan></text><rect x="50" y="925" width="400" height="148" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="66" y="957" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="66" dy="0">«R2DBC entity» OrderEntity</tspan></text><text x="66" y="989" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="66" dy="0">@Table(&quot;orders&quot;)</tspan><tspan x="66" dy="25.6">stopSequence: Integer</tspan><tspan x="66" dy="25.6">Incluye representación SQL completa</tspan></text><rect x="620" y="925" width="400" height="148" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="636" y="957" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="636" dy="0">«R2DBC entity» DeliveryProofEntity</tspan></text><text x="636" y="989" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="636" dy="0">@Table(&quot;delivery_proofs&quot;)</tspan><tspan x="636" dy="25.6">Mapeada a record DeliveryProof</tspan><tspan x="636" dy="25.6">Metadatos de integridad: puerto SQL</tspan></text><rect x="1190" y="925" width="400" height="174" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="1206" y="957" font-family="Arial, sans-serif" font-size="22" fill="#134766" text-anchor="start"><tspan x="1206" dy="0">«record anidado» Review</tspan></text><text x="1206" y="989" font-family="Arial, sans-serif" font-size="20" fill="#18324b" text-anchor="start"><tspan x="1206" dy="0">BusinessWorkflow.Review</tspan><tspan x="1206" dy="25.6">routeId: Long</tspan><tspan x="1206" dy="25.6">approved, accepted: boolean</tspan><tspan x="1206" dy="25.6">loadWeightKg: Double</tspan></text><path d="M250,735 L250,925" fill="none" stroke="#48667e" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="257" y="822" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="257" dy="0">mapper</tspan></text><path d="M820,743 L820,925" fill="none" stroke="#48667e" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="827" y="826" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="827" dy="0">mapper</tspan></text><path d="M1020,320 L1570,320 L1570,925" fill="none" stroke="#48667e" stroke-width="1.7"/><text x="1080" y="309" font-family="Arial, sans-serif" font-size="18" fill="#18324b" text-anchor="start"><tspan x="1080" dy="0">Route 1 — 0..1 Review</tspan></text><text x="40" y="1195" font-family="Arial, sans-serif" font-size="20" fill="#52677b" text-anchor="start"><tspan x="40" dy="0">Las multiplicidades describen el vínculo persistente permitido por PK/FK/UNIQUE; un record guarda IDs, no referencias ORM.</tspan><tspan x="40" dy="25.6">geometry y total_duration_min se escriben por repositorio SQL; Route no declara esos atributos.</tspan></text></svg>