<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1320" viewBox="0 0 1640 1320"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#48667e" stroke-width="1.5"/></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="white" stroke="#48667e" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="30" fill="#153d5b" text-anchor="start"><tspan x="38" dy="0">Casos de uso · acceso, pedido y preparación</tspan></text><text x="38" y="82" font-family="Arial, sans-serif" font-size="18" fill="#52677b" text-anchor="start"><tspan x="38" dy="0">EcoRoute · UML · asociaciones de participación; la secuencia temporal se explica en las fichas CU.</tspan></text><rect x="340" y="118" width="930" height="1090" rx="8" fill="#f9fbfd" stroke="#3e637e" stroke-width="2"/><text x="805" y="151" font-family="Arial, sans-serif" font-size="25" fill="#153d5b" text-anchor="middle"><tspan x="805" dy="0">EcoRoute</tspan></text><path d="M192,242 C300,242 360,218 505,218" fill="none" stroke="#92a8b7" stroke-width="1.35"/><path d="M192,682 C300,682 360,218 505,218" fill="none" stroke="#92a8b7" stroke-width="1.35"/><path d="M1428,212 C1330,212 1260,218 1110,218" fill="none" stroke="#948562" stroke-width="1.35"/><path d="M1428,742 C1330,742 1260,330 1110,330" fill="none" stroke="#92a8b7" stroke-width="1.35"/><path d="M1428,212 C1330,212 1260,330 1110,330" fill="none" stroke="#948562" stroke-width="1.35"/><path d="M192,242 C300,242 360,442 505,442" fill="none" stroke="#92a8b7" stroke-width="1.35"/><path d="M1428,212 C1330,212 1260,442 1110,442" fill="none" stroke="#948562" stroke-width="1.35"/><path d="M192,242 C300,242 360,554 505,554" fill="none" stroke="#92a8b7" stroke-width="1.35"/><path d="M192,682 C300,682 360,666 505,666" fill="none" stroke="#92a8b7" stroke-width="1.35"/><path d="M192,682 C300,682 360,778 505,778" fill="none" stroke="#92a8b7" stroke-width="1.35"/><path d="M192,682 C300,682 360,890 505,890" fill="none" stroke="#92a8b7" stroke-width="1.35"/><path d="M192,242 C300,242 360,1002 505,1002" fill="none" stroke="#92a8b7" stroke-width="1.35"/><path d="M1428,742 C1330,742 1260,1114 1110,1114" fill="none" stroke="#92a8b7" stroke-width="1.35"/><ellipse cx="805" cy="218" rx="306" ry="44" fill="white" stroke="#2a6c8c" stroke-width="1.7"/><text x="805" y="213" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="middle"><tspan x="805" dy="0">CU-01 · P08</tspan><tspan x="805" dy="24.32">Autenticar y cerrar la sesión web</tspan></text><ellipse cx="805" cy="330" rx="306" ry="44" fill="white" stroke="#2a6c8c" stroke-width="1.7"/><text x="805" y="325" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="middle"><tspan x="805" dy="0">CU-02 · P08</tspan><tspan x="805" dy="24.32">Autenticar al conductor y restaurar su identidad</tspan></text><ellipse cx="805" cy="442" rx="306" ry="44" fill="white" stroke="#2a6c8c" stroke-width="1.7"/><text x="805" y="437" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="middle"><tspan x="805" dy="0">CU-03 · P08/P06</tspan><tspan x="805" dy="24.32">Administrar roles y vínculo de una identidad</tspan></text><ellipse cx="805" cy="554" rx="306" ry="44" fill="white" stroke="#2a6c8c" stroke-width="1.7"/><text x="805" y="549" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="middle"><tspan x="805" dy="0">CU-04 · P06/P09</tspan><tspan x="805" dy="24.32">Habilitar conductor y vehículo para una jornada</tspan></text><ellipse cx="805" cy="666" rx="306" ry="44" fill="white" stroke="#2a6c8c" stroke-width="1.7"/><text x="805" y="661" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="middle"><tspan x="805" dy="0">CU-05 · P01</tspan><tspan x="805" dy="24.32">Registrar y consultar un pedido sin ruta</tspan></text><ellipse cx="805" cy="778" rx="306" ry="44" fill="white" stroke="#2a6c8c" stroke-width="1.7"/><text x="805" y="773" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="middle"><tspan x="805" dy="0">CU-06 · P01</tspan><tspan x="805" dy="24.32">Confirmar las condiciones comerciales y la</tspan><tspan x="805" dy="24.32">promesa</tspan></text><ellipse cx="805" cy="890" rx="306" ry="44" fill="white" stroke="#2a6c8c" stroke-width="1.7"/><text x="805" y="885" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="middle"><tspan x="805" dy="0">CU-07 · P02</tspan><tspan x="805" dy="24.32">Preparar ruta y asignar el pedido confirmado</tspan></text><ellipse cx="805" cy="1002" rx="306" ry="44" fill="white" stroke="#2a6c8c" stroke-width="1.7"/><text x="805" y="997" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="middle"><tspan x="805" dy="0">CU-08 · P02</tspan><tspan x="805" dy="24.32">Revisar el recorrido y aprobar el plan</tspan></text><ellipse cx="805" cy="1114" rx="306" ry="44" fill="white" stroke="#2a6c8c" stroke-width="1.7"/><text x="805" y="1109" font-family="Arial, sans-serif" font-size="19" fill="#18324b" text-anchor="middle"><tspan x="805" dy="0">CU-09 · P02</tspan><tspan x="805" dy="24.32">Aceptar la hoja de ruta desde el móvil</tspan></text><circle cx="160" cy="200" r="15" fill="white" stroke="#344f65" stroke-width="2"/><path d="M160,215 v45 m-28,-30 h56 m-28,30 l-23,34 m23,-34 l23,34" fill="none" stroke="#344f65" stroke-width="2"/><text x="160" y="310" font-family="Arial, sans-serif" font-size="18" fill="#18324b" text-anchor="middle"><tspan x="160" dy="0">«actor humano»</tspan><tspan x="160" dy="23.04">Jefatura /</tspan><tspan x="160" dy="23.04">administrador</tspan></text><circle cx="160" cy="640" r="15" fill="white" stroke="#344f65" stroke-width="2"/><path d="M160,655 v45 m-28,-30 h56 m-28,30 l-23,34 m23,-34 l23,34" fill="none" stroke="#344f65" stroke-width="2"/><text x="160" y="750" font-family="Arial, sans-serif" font-size="18" fill="#18324b" text-anchor="middle"><tspan x="160" dy="0">«actor humano»</tspan><tspan x="160" dy="23.04">Operador logístico</tspan></text><circle cx="1460" cy="700" r="15" fill="white" stroke="#344f65" stroke-width="2"/><path d="M1460,715 v45 m-28,-30 h56 m-28,30 l-23,34 m23,-34 l23,34" fill="none" stroke="#344f65" stroke-width="2"/><text x="1460" y="810" font-family="Arial, sans-serif" font-size="18" fill="#18324b" text-anchor="middle"><tspan x="1460" dy="0">«actor humano»</tspan><tspan x="1460" dy="23.04">Conductor</tspan></text><circle cx="1460" cy="170" r="15" fill="white" stroke="#344f65" stroke-width="2"/><path d="M1460,185 v45 m-28,-30 h56 m-28,30 l-23,34 m23,-34 l23,34" fill="none" stroke="#344f65" stroke-width="2"/><text x="1460" y="280" font-family="Arial, sans-serif" font-size="18" fill="#18324b" text-anchor="middle"><tspan x="1460" dy="0">«sistema externo»</tspan><tspan x="1460" dy="23.04">Keycloak</tspan></text><text x="38" y="1260" font-family="Arial, sans-serif" font-size="19" fill="#52677b" text-anchor="start"><tspan x="38" dy="0">Keycloak participa como soporte externo de identidad. EcoRoute es el límite del sistema, no actor de negocio.</tspan><tspan x="38" dy="24.32">Cliente/receptor y proveedor comercial intervienen en tareas humanas; no se dibujan como usuarios directos sin interfaz.</tspan></text></svg>