<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1190" viewBox="0 0 1650 1190"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#48667e" stroke-width="1.5"/></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="white" stroke="#48667e" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="30" fill="#153d5b" text-anchor="start"><tspan x="38" dy="0">Modelo analítico vigente · cambios V16</tspan></text><text x="38" y="82" font-family="Arial, sans-serif" font-size="18" fill="#52677b" text-anchor="start"><tspan x="38" dy="0">Vista analytics_route_facts y función de calidad GPS; las dependencias punteadas son linaje SQL, no FK.</tspan></text><rect x="50" y="145" width="470" height="210" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="66" y="177" font-family="Arial, sans-serif" font-size="24" fill="#134766" text-anchor="start"><tspan x="66" dy="0">Tablas de operación</tspan></text><text x="66" y="209" font-family="Arial, sans-serif" font-size="22" fill="#18324b" text-anchor="start"><tspan x="66" dy="0">routes: vehículo e intervalo real</tspan><tspan x="66" dy="28.16">vehicle_gps_history: ping_time y GPS</tspan><tspan x="66" dy="28.16">orders: estado y route_id</tspan><tspan x="66" dy="28.16">V15: terminal incluye RETURNED</tspan></text><rect x="620" y="145" width="970" height="210" rx="10" fill="#eaf4ee" stroke="#6f8ba1" stroke-width="1.5"/><text x="636" y="177" font-family="Arial, sans-serif" font-size="24" fill="#134766" text-anchor="start"><tspan x="636" dy="0">analytics_route_gps_quality(max_speed_kmh, max_gap_seconds)</tspan></text><text x="636" y="209" font-family="Arial, sans-serif" font-size="22" fill="#18324b" text-anchor="start"><tspan x="636" dy="0">Función SQL STABLE · SECURITY DEFINER · búsqueda fijada</tspan><tspan x="636" dy="28.16">Muestras dentro de inicio/fin real de cada ruta</tspan><tspan x="636" dy="28.16">LAG por ping_time,id · Haversine R=6371.0088 km</tspan><tspan x="636" dy="28.16">Política local: velocidad ≤160 km/h e intervalo ≤900 s</tspan></text><path d="M520,250 L620,250" fill="none" stroke="#48667e" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="577" y="242" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="577" dy="0">lee</tspan></text><rect x="50" y="455" width="470" height="290" rx="10" fill="#fff" stroke="#6f8ba1" stroke-width="1.5"/><text x="66" y="487" font-family="Arial, sans-serif" font-size="24" fill="#134766" text-anchor="start"><tspan x="66" dy="0">Vistas restantes</tspan></text><text x="66" y="519" font-family="Arial, sans-serif" font-size="22" fill="#18324b" text-anchor="start"><tspan x="66" dy="0">analytics_order_facts</tspan><tspan x="66" dy="28.16">analytics_goal_facts</tspan><tspan x="66" dy="28.16">analytics_goal_history_facts</tspan><tspan x="66" dy="28.16">Permisos del rol ecoroute_bi_reader:</tspan><tspan x="66" dy="28.16">SELECT solo sobre vistas;</tspan><tspan x="66" dy="28.16">EXECUTE sobre función V16</tspan></text><rect x="620" y="455" width="970" height="290" rx="10" fill="#f3f8fb" stroke="#6f8ba1" stroke-width="1.5"/><text x="636" y="487" font-family="Arial, sans-serif" font-size="24" fill="#134766" text-anchor="start"><tspan x="636" dy="0">analytics_route_facts · columnas agregadas en V16</tspan></text><text x="636" y="519" font-family="Arial, sans-serif" font-size="22" fill="#18324b" text-anchor="start"><tspan x="636" dy="0">gps_quality / observed_distance_km</tspan><tspan x="636" dy="28.16">valid_gps_sample_count / invalid_gps_sample_count</tspan><tspan x="636" dy="28.16">gps_segment_count / rejected_gps_segment_count</tspan><tspan x="636" dy="28.16">implausible_speed_segment_count / nonpositive_time_segment_count</tspan><tspan x="636" dy="28.16">excessive_gap_segment_count</tspan><tspan x="636" dy="28.16">actual_gps_distance_km solo si calidad AVAILABLE</tspan></text><path d="M1100,355 L1100,455" fill="none" stroke="#48667e" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="1107" y="397" font-family="Arial, sans-serif" font-size="17" fill="#294c64" text-anchor="start"><tspan x="1107" dy="0">proyecta</tspan></text><rect x="50" y="845" width="1540" height="205" rx="10" fill="#fffaf1" stroke="#6f8ba1" stroke-width="1.5"/><text x="66" y="877" font-family="Arial, sans-serif" font-size="25" fill="#134766" text-anchor="start"><tspan x="66" dy="0">Contrato de lectura y límites</tspan></text><text x="66" y="909" font-family="Arial, sans-serif" font-size="23" fill="#18324b" text-anchor="start"><tspan x="66" dy="0">API: R2dbcAnalyticsAdapter llama a la función con política configurable. Vista SQL: parámetros por defecto.</tspan><tspan x="66" dy="29.44">km_per_delivery = distancia GPS válida / entregas DELIVERED; divisor cero → NULL.</tspan><tspan x="66" dy="29.44">time_per_stop_min = minutos de operación / terminales DELIVERED, FAILED, RETURNED.</tspan><tspan x="66" dy="29.44">Una traza rechazada conserva datos originales; observed_distance_km no representa distancia recorrida validada.</tspan></text><text x="50" y="1120" font-family="Arial, sans-serif" font-size="21" fill="#52677b" text-anchor="start"><tspan x="50" dy="0">V16 añade nueve columnas al final de analytics_route_facts; no agrega tablas de negocio ni FK.</tspan><tspan x="50" dy="26.88">No hay enlace físico a Keycloak ni tablas CORP en este modelo.</tspan></text></svg>